[package]
name = "matrix-mcp"
version = "0.2.0"
edition = "2024"
description = "Send-only MCP server for Matrix with E2EE and a room whitelist"
license = "Apache-2.0"
repository = "https://github.com/trobanga/matrix-mcp"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
matrix-sdk = "0.19.1"
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io"] }
rpassword = "7"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
matrix-sdk = { version = "0.19.1", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
rmcp = { version = "3.9.0", features = ["client"] }
